server {
    listen 80;
    server_name your-domain.com;

    # 静态前端页面
    root /path/to/fr/static;      # ← fr.html 放在这里
    index fr.html;

    # API 请求转发给 Flask
    location /api/ {
        proxy_pass http://127.0.0.1:5000;   # Flask 运行在 5000 端口
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}